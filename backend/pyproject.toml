[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pk-control-backend"
version = "0.1.0"
description = "API системы PK CONTROL"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "openpyxl>=3.1,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI injects request dependencies through function defaults by design.
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
